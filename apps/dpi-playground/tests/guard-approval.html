<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guard approval component test</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp } from "vue";
      import { guardApprovalStates } from "/src/client/guard-approval.ts";
      import TranscriptItem from "/src/components/TranscriptItem.vue";
      import { selected } from "/src/client/store";

      selected.value = { deviceId: "local", sessionId: "approval-test", agentId: 1 };
      const response = await fetch("/__guard_approval_fixture");
      if (!response.ok) throw new Error("Could not load the captured transcript fixture");
      const transcript = await response.json();
      const itemIndex = transcript.items.findIndex(
        (item) =>
          item.kind === "assistant" &&
          item.blocks.some(
            (block) => block.type === "tool" && typeof block.call.result === "string",
          ),
      );
      if (itemIndex < 0) throw new Error("Captured transcript has no assistant tool result block");
      createApp(TranscriptItem, {
        item: transcript.items[itemIndex],
        itemIndex,
        guardApprovals: guardApprovalStates(transcript.items),
      }).mount("#app");
    </script>
  </body>
</html>
